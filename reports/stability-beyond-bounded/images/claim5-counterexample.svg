<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" rx="28" fill="#fff7ed"/>
  <text x="64" y="70" fill="#7c2d12" font-family="Arial,sans-serif" font-size="32" font-weight="700">Theorem 3.10: the coefficient vanishes, the gap does not</text>
  <g font-family="Arial,sans-serif">
    <rect x="64" y="128" width="450" height="240" rx="20" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
    <text x="96" y="175" fill="#9a3412" font-size="23" font-weight="700">Complete population: labels {0,1}</text>
    <text x="96" y="220" fill="#334155" font-size="21">m = u = 1 · predictor h = 0</text>
    <text x="96" y="260" fill="#334155" font-size="21">partition gaps: +1, −1</text>
    <text x="96" y="300" fill="#334155" font-size="21">at y = 1/2: event probability = 1/2</text>
    <text x="96" y="340" fill="#334155" font-size="21">all assumptions checked pointwise</text>
    <path d="M535 245 L665 245" stroke="#ea580c" stroke-width="8"/>
    <path d="M650 228 L675 245 L650 262" fill="none" stroke="#ea580c" stroke-width="8"/>
    <rect x="690" y="128" width="446" height="240" rx="20" fill="#4a1d2b"/>
    <text x="724" y="175" fill="#fecdd3" font-size="23" font-weight="700">Displayed right side</text>
    <text x="724" y="225" fill="#f8fafc" font-size="22">|1/u − 1/m| = 0</text>
    <text x="724" y="266" fill="#f8fafc" font-size="22">H = 0 ⇒ V′p = V′2 = 0</text>
    <text x="724" y="325" fill="#ffffff" font-size="46" font-weight="700">1/2 ≤ 0</text>
  </g>
  <rect x="64" y="404" width="1072" height="66" rx="14" fill="#ffedd5"/>
  <text x="92" y="445" fill="#7c2d12" font-family="Arial,sans-serif" font-size="22" font-weight="700">Control: 1/u + 1/m = 2 covers the actual swap increment 2.</text>
</svg>
